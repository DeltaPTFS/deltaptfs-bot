name: Delta Main Bot CI
on:
  pull_request:
  push:
    branches: [main, feat/crew-and-flight-integration]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
